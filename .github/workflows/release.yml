name: Release

on:
  push:
    tags:
      - "v*"
  # Lets the whole build be exercised without publishing anything - useful before
  # a release that clients auto-update into, and the only way to find out whether
  # the Windows job works without burning a tag on it. The release job below is
  # gated on a tag, so a manual run builds and stops.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Cheap and first: the updaters compare these against the release tag, so a
  # forgotten bump means clients either never update or update in a loop. Worth
  # catching before anyone builds anything - including before the operator builds
  # the APK locally.
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every version declaration matches the tag
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Not a tag build - nothing to compare against."
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          # A prerelease tag (v1.19.0-beta.1) is checked on its numeric part,
          # exactly as both updaters compare it (parseVersion strips the same
          # suffix) - the files carry the plain X.Y.Z either way.
          tag="${tag%%-*}"
          fail=0

          win=$(grep -oE 'AppVersion = "[0-9]+\.[0-9]+\.[0-9]+"' desktop/version.go | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          wails=$(grep -oE '"productVersion": "[0-9]+\.[0-9]+\.[0-9]+"' desktop/wails.json | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          andr=$(grep -oE 'versionName = "[0-9]+\.[0-9]+\.[0-9]+"' android/app/build.gradle.kts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')

          for pair in "desktop/version.go:$win" "desktop/wails.json:$wails" "android/app/build.gradle.kts:$andr"; do
            file="${pair%%:*}"; got="${pair##*:}"
            if [ "$got" != "$tag" ]; then
              echo "::error file=$file::version $got does not match tag $tag"
              fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "all three match $tag"
          exit $fail

  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run tests
        run: go test ./internal/... ./cmd/...

      # The race detector needs cgo, which isn't available on the maintainer's
      # Windows machine - so this is the only place it ever runs. Worth it: the
      # multiplexer, the connection pool and the session refreshers are all
      # concurrent, and a data race there surfaces as an unreproducible crash on
      # someone's phone. Only on amd64; the arm64 job would need cross-toolchain
      # setup for no extra coverage.
      - name: Run tests under the race detector
        if: matrix.arch == 'amd64'
        env:
          CGO_ENABLED: "1"
        run: go test -race ./internal/... ./cmd/...

      - name: Build phantom-server
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: go build -o "phantom-server-linux-${{ matrix.arch }}" ./cmd/server

      - name: Build phantom-keygen
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: go build -o "phantom-keygen-linux-${{ matrix.arch }}" ./cmd/keygen

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: |
            phantom-server-linux-${{ matrix.arch }}
            phantom-keygen-linux-${{ matrix.arch }}
          retention-days: 1

  # The Windows client, built the way the README documents. Its updater looks for
  # an asset named exactly "phantom.exe" in the latest release, so the artifact
  # name is not cosmetic.
  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build phantom.exe
        working-directory: windows
        run: wails build -platform windows/amd64

      # After the build, not before: main.go embeds frontend/dist, which doesn't
      # exist in a fresh checkout until Wails has built the frontend - so the
      # package won't even compile earlier in the job. The Windows half of the
      # desktop package is only ever compiled here.
      - name: Test the Windows client package
        working-directory: windows
        run: go test ./...

      - uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: desktop/build/bin/phantom.exe
          retention-days: 1

  # phantomd, the privileged half of the Linux client, tested end to end on a
  # real kernel: a Phantom server on the runner, phantomd connecting to it,
  # and checks that traffic and DNS go through the tunnel and that
  # disconnecting (or SIGTERM) restores the network. The only place the Linux
  # networking code - netlink rules, nftables, the TUN device - ever runs
  # before a user's machine.
  linux-daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build server, keygen and phantomd
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p e2e
          go build -o e2e/phantom-server ./cmd/server
          go build -o e2e/phantom-keygen ./cmd/keygen
          go build -o e2e/phantomd ./cmd/phantomd

      - name: End-to-end test
        run: sudo bash packaging/linux/e2e.sh e2e

  # The Linux client: the same Wails app as Windows, built against GTK 3 and
  # WebKitGTK 4.1 on the oldest Ubuntu still supported, so the binary runs on
  # anything with a newer glibc (Ubuntu 22.04+, Debian 12+, Fedora, Arch and
  # Manjaro, openSUSE, Mint 21+). Shipped four ways - the window's updater
  # picks the one matching how it was installed (desktop/updater_linux.go):
  # a universal tar.gz with install.sh, and .deb/.rpm/Arch packages.
  linux-client:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install GTK and WebKitGTK headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install Wails and nfpm
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build the window
        working-directory: desktop
        run: wails build -platform linux/amd64 -tags webkit2_41

      - name: Test the desktop package on Linux
        working-directory: desktop
        run: go test -tags webkit2_41 ./...

      - name: Build phantomd
        env:
          CGO_ENABLED: "0"
        run: go build -o dist/linux/phantomd ./cmd/phantomd

      - name: Package
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(grep -oE 'AppVersion = "[^"]+"' desktop/version.go | cut -d'"' -f2)
          fi
          cp desktop/build/bin/phantom dist/linux/phantom

          # Universal tarball: everything install.sh needs, in one directory.
          mkdir -p tarball/phantom
          cp dist/linux/phantom dist/linux/phantomd tarball/phantom/
          cp packaging/linux/install.sh packaging/linux/uninstall.sh \
             packaging/linux/phantomd.service packaging/linux/phantom.desktop \
             packaging/linux/com.phantom.vpn.policy desktop/build/linux/phantom.png tarball/phantom/
          tar -C tarball -czf phantom-linux-amd64.tar.gz phantom

          export VERSION="$version" ARCH=amd64
          nfpm package -f packaging/linux/nfpm.yaml -p deb -t phantom-linux-amd64.deb
          nfpm package -f packaging/linux/nfpm.yaml -p rpm -t phantom-linux-amd64.rpm
          nfpm package -f packaging/linux/nfpm.yaml -p archlinux -t phantom-linux-amd64.pkg.tar.zst
          ls -la phantom-linux-amd64.*

      - name: Check the .deb installs and starts its service
        run: |
          sudo apt-get install -y ./phantom-linux-amd64.deb
          systemctl is-active phantomd.service
          test -S /run/phantom/phantomd.sock
          /usr/lib/phantom/phantomd status
          test "$(cat /usr/lib/phantom/install-method)" = deb
          sudo apt-get remove -y phantom
          ! systemctl is-active phantomd.service

      - uses: actions/upload-artifact@v4
        with:
          name: linux-client
          path: phantom-linux-amd64.*
          retention-days: 1

  # The browser extension (extension/), zipped once per browser family. Plain
  # file copies - no dependencies to install.
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and zip the extension
        working-directory: extension
        run: |
          node build.mjs
          for target in chromium firefox; do
            (cd "dist/$target" && zip -qr "../../phantom-extension-$target.zip" .)
          done
          ls -la *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: extension/phantom-extension-*.zip
          retention-days: 1

  # Publishes a DRAFT. Android's signing key deliberately never enters CI - it
  # cannot be rotated without stranding every existing install, so it stays on the
  # operator's machine and the APK keeps being built there, as it always has been.
  #
  # A draft is invisible to GitHub's /releases/latest endpoint, which is exactly
  # what both client updaters query. So the dangerous state - a published release
  # whose assets the clients can't use, prompting a server upgrade that then
  # strands everyone - cannot occur: until the operator attaches phantom.apk and
  # presses Publish, no client sees anything at all.
  release:
    needs: [versions, server, windows-client, linux-daemon, linux-client, extension]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Fail if anything CI is responsible for is missing
        run: |
          missing=0
          for f in phantom.exe phantom-server-linux-amd64 phantom-server-linux-arm64 \
                   phantom-keygen-linux-amd64 phantom-keygen-linux-arm64 \
                   phantom-linux-amd64.tar.gz phantom-linux-amd64.deb phantom-linux-amd64.rpm \
                   phantom-linux-amd64.pkg.tar.zst \
                   phantom-extension-chromium.zip phantom-extension-firefox.zip; do
            if [ ! -f "dist/$f" ]; then echo "::error::dist/$f is missing"; missing=1; fi
          done
          [ "$missing" = 0 ]
          ls -la dist/

      # Published alongside the binaries so scripts/install.sh can verify what it
      # downloaded instead of trusting the transfer blindly. Note this only binds
      # the artifacts to this release - it is an integrity check, not a signature,
      # and offers nothing against a compromised release itself.
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          # Any "-suffix" tag (v1.19.0-beta.1) is published as a GitHub
          # prerelease: /releases/latest skips those, so stable-channel clients
          # never see it, and only clients with "Скачивать beta-версии" on
          # (which read /releases instead) are offered it. Set here rather than
          # left to the operator's Publish click, where forgetting the checkbox
          # would push a test build to everyone.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          append_body: true
          body: |
            > **This release is a draft.** Attach `phantom.apk` (built locally -
            > the signing key is deliberately not in CI) and then press Publish.
            > Until it is published, no client's updater can see it, which is what
            > keeps a half-complete release from reaching anyone.

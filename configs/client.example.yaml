server: "your-domain.example:8443"
# Optional failover list: additional address:port endpoints, all serving the
# same domain/cert/psk (e.g. several VPS IPs, or the same host on alternate
# ports). Tried in order with last-good memory, so blocking one IP/port doesn't
# take the tunnel down. If set, takes precedence over the single "server" above.
# servers:
#   - "203.0.113.10:8443"
#   - "198.51.100.20:443"
domain: "your-domain.example"
fingerprint: "chrome133"
psk: "REPLACE_WITH_PSK_FROM_KEYGEN"
server_public_key: "REPLACE_WITH_SERVER_PUBLIC_KEY_FROM_KEYGEN"
listen: "127.0.0.1:1080"
listen_http: "127.0.0.1:1081"
pool_size: 4
log_level: "info"
# Optional location label for the GUI tile. Normally you don't need these: the
# apps resolve the server's country from its IP automatically, once per saved
# config, and pin the result.
#
# Set them to opt OUT of that. They take precedence, and when present no
# geolocation service is contacted at all - which matters because such a query
# tells a third party the address of this server. The automatic lookup runs once
# rather than on a timer for the same reason, but once is still once.
#
# country_code is a two-letter ISO code. Android turns it into a flag emoji
# locally (nothing is downloaded); Windows shows the text, because Chromium there
# doesn't draw flag emoji.
# country: "Germany"
# country_code: "DE"
